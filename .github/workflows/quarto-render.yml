name: Quarto render (smoke test)

# Catches workshop-breaking changes:
# - Quarto can't render the site (broken qmd, broken yaml)
# - A lecture's R simulation chunks crash (eval: true)
# - A required package isn't installable
#
# Split into two jobs so the no-R parts (everything except lectures) finish in
# ~1-2 min, while lectures (which need R + tidyverse for eval: true chunks)
# run in parallel using P3M binary packages and aggressive caching.

on:
  push:
    branches: [ main, claude/** ]
    paths:
      - '**.qmd'
      - '**.yml'
      - '**.css'
      - 'render_all.sh'
      - '.github/workflows/quarto-render.yml'
  pull_request:
    paths:
      - '**.qmd'
      - '**.yml'
      - '**.css'
      - 'render_all.sh'
  workflow_dispatch: {}

# Cancel an in-progress run when a new commit is pushed to the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------
  # Job 1: render the parts that don't need R (top-level pages, Resources
  # appendices, Exercise tutorials with eval: false). Fast: ~1-2 min.
  # ---------------------------------------------------------------------
  render-no-r:
    name: Render site (no R needed)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.5.57'

      - name: Render top-level pages + Resources
        run: quarto render

      - name: Render Exercise tutorials (eval: false)
        run: |
          cd Exercise_Folder
          quarto render

      - name: Verify expected artifacts
        run: |
          test -f docs/index.html
          test -f docs/Exercise_Folder/Tutorial_01_QC_Preprocessing.html
          test -f docs/Resources_Folder/Chapter_P2_R_and_CommandLine.html
          echo "no-R render: artifacts present."

      - name: Upload partial site
        uses: actions/upload-artifact@v4
        with:
          name: rendered-site-no-r
          path: docs/
          retention-days: 7

  # ---------------------------------------------------------------------
  # Job 2: render the lectures — these have eval: true R simulation chunks
  # and need a working R + tidyverse install. Use P3M (Posit Public Package
  # Manager) for binary packages on Linux to avoid source compilation.
  # Aggressive caching keeps re-runs ~30s instead of ~5min.
  # ---------------------------------------------------------------------
  render-lectures:
    name: Render lectures (with R)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'
          # Use Posit Public Package Manager for prebuilt binaries on Linux.
          # Without this, tidyverse compiles from source (~30+ minutes).
          use-public-rspm: true

      - name: Set up R package dependency cache
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # Pin the package set explicitly so the cache key is stable across runs
          # without needing a DESCRIPTION file. These are the only packages the
          # lecture R chunks use (rendering, not analysis).
          packages: |
            any::rmarkdown
            any::knitr
            any::tidyverse
            any::ggplot2
            any::gridExtra
            any::patchwork
            any::tibble
            any::forcats
            any::RColorBrewer
          cache-version: 1

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.5.57'

      - name: Render lectures
        run: |
          cd Lecture_Folder
          quarto render

      - name: Verify expected artifacts
        run: |
          test -f docs/Lecture_Folder/Lecture_00_Bulk_vs_scRNAseq.html
          test -f docs/Lecture_Folder/Lecture_06_DESeq2_DE.html
          test -f docs/Lecture_Folder/Lecture_16_Spatial.html
          echo "lecture render: artifacts present."

      - name: Upload lecture site
        uses: actions/upload-artifact@v4
        with:
          name: rendered-site-lectures
          path: docs/Lecture_Folder/
          retention-days: 7
