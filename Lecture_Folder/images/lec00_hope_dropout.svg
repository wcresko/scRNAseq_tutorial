<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" font-family="Helvetica,Arial,sans-serif">
  <style>.h{font-size:17px;font-weight:bold;fill:#2c3e50}.t{font-size:13px;fill:#2c3e50}.s{font-size:11px;fill:#555}</style>
  <text x="20" y="26" class="h">Dropout: each cell yields only a fraction of its transcripts — so we sequence many</text>

  <!-- one cell, full transcriptome -->
  <text x="40" y="62" class="t" font-weight="bold">One cell's mRNA</text>
  <circle cx="130" cy="150" r="70" fill="#eafaf1" stroke="#27ae60"/>
  <g>
    <circle cx="105" cy="120" r="6" fill="#16a085"/><circle cx="150" cy="120" r="6" fill="#16a085"/><circle cx="120" cy="150" r="6" fill="#16a085"/>
    <circle cx="160" cy="155" r="6" fill="#16a085"/><circle cx="100" cy="170" r="6" fill="#16a085"/><circle cx="140" cy="180" r="6" fill="#16a085"/>
    <circle cx="170" cy="135" r="6" fill="#16a085"/><circle cx="115" cy="195" r="6" fill="#16a085"/><circle cx="150" cy="105" r="6" fill="#16a085"/>
    <circle cx="90" cy="145" r="6" fill="#16a085"/><circle cx="175" cy="170" r="6" fill="#16a085"/><circle cx="130" cy="115" r="6" fill="#16a085"/>
  </g>
  <text x="70" y="240" class="s">~all transcripts present</text>

  <!-- arrow capture -->
  <line x1="215" y1="150" x2="300" y2="150" stroke="#7f8c8d" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="218" y="140" class="s">capture</text>
  <text x="216" y="172" class="s">~10–30%</text>

  <!-- captured cell -->
  <text x="320" y="62" class="t" font-weight="bold">What you sequence</text>
  <circle cx="400" cy="150" r="70" fill="#fdf2e2" stroke="#e67e22"/>
  <g>
    <circle cx="390" cy="135" r="6" fill="#16a085"/><circle cx="420" cy="165" r="6" fill="#16a085"/><circle cx="375" cy="170" r="6" fill="#16a085"/>
    <circle cx="415" cy="120" r="6" fill="#16a085"/>
    <!-- dropped (open) -->
    <circle cx="405" cy="150" r="6" fill="none" stroke="#bbb"/><circle cx="380" cy="145" r="6" fill="none" stroke="#bbb"/>
    <circle cx="430" cy="140" r="6" fill="none" stroke="#bbb"/><circle cx="395" cy="180" r="6" fill="none" stroke="#bbb"/>
    <circle cx="420" cy="185" r="6" fill="none" stroke="#bbb"/>
  </g>
  <text x="340" y="240" class="s">filled = detected · open = dropout (zero)</text>

  <!-- many cells reconstruct -->
  <rect x="540" y="80" width="320" height="200" rx="10" fill="#fbfbfb" stroke="#bbb"/>
  <text x="556" y="106" class="t" font-weight="bold">Why it's OK (mostly)</text>
  <text x="556" y="132" class="s">A cell type's transcriptome is recovered</text>
  <text x="556" y="150" class="s">by pooling **many** cells of that type.</text>
  <g>
    <circle cx="575" cy="185" r="12" fill="#fdf2e2" stroke="#e67e22"/><circle cx="605" cy="185" r="12" fill="#fdf2e2" stroke="#e67e22"/>
    <circle cx="635" cy="185" r="12" fill="#fdf2e2" stroke="#e67e22"/><circle cx="665" cy="185" r="12" fill="#fdf2e2" stroke="#e67e22"/>
    <line x1="690" y1="185" x2="720" y2="185" stroke="#7f8c8d" stroke-width="2" marker-end="url(#a)"/>
    <circle cx="755" cy="185" r="16" fill="#eafaf1" stroke="#27ae60"/>
  </g>
  <text x="556" y="232" class="s">But **lowly-expressed genes** are hit hardest —</text>
  <text x="556" y="250" class="s">and per-cell DE must respect the zeros.</text>

  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7f8c8d"/></marker></defs>
</svg>
