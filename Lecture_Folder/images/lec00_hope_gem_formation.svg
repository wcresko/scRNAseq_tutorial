<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" font-family="Helvetica,Arial,sans-serif">
  <style>.h{font-size:17px;font-weight:bold;fill:#2c3e50}.t{font-size:13px;fill:#2c3e50}.s{font-size:11px;fill:#555}.lab{font-size:12px;font-weight:bold;fill:#2c3e50}</style>
  <text x="20" y="26" class="h">GEM formation: one cell + one barcoded gel bead + oil → one reaction droplet</text>

  <!-- inputs flowing in -->
  <text x="40" y="62" class="lab">Cells</text>
  <circle cx="60" cy="95" r="12" fill="#27ae60"/><circle cx="95" cy="120" r="12" fill="#27ae60"/><circle cx="55" cy="150" r="12" fill="#27ae60"/>
  <text x="40" y="205" class="lab">Gel beads</text>
  <circle cx="60" cy="240" r="13" fill="#3498db"/><circle cx="95" cy="265" r="13" fill="#3498db"/><circle cx="55" cy="295" r="13" fill="#3498db"/>
  <text x="62" y="244" text-anchor="middle" font-size="9" fill="#fff">BC</text>

  <!-- microfluidic junction -->
  <path d="M130,120 L250,180 L130,240" fill="none" stroke="#bbb" stroke-width="14" stroke-linejoin="round"/>
  <path d="M250,180 L330,180" stroke="#bbb" stroke-width="14"/>
  <text x="150" y="175" class="s">oil</text>
  <line x1="250" y1="140" x2="250" y2="165" stroke="#e67e22" stroke-width="6" marker-end="url(#a)"/>
  <line x1="250" y1="220" x2="250" y2="195" stroke="#e67e22" stroke-width="6" marker-end="url(#a)"/>
  <text x="200" y="135" class="s">oil pinches off droplets</text>

  <!-- GEMs out -->
  <g>
    <circle cx="380" cy="160" r="26" fill="#fdf2e2" stroke="#e67e22"/>
    <circle cx="372" cy="158" r="8" fill="#27ae60"/><circle cx="390" cy="166" r="9" fill="#3498db"/>
    <circle cx="440" cy="200" r="26" fill="#fdf2e2" stroke="#e67e22"/>
    <circle cx="433" cy="198" r="8" fill="#27ae60"/><circle cx="450" cy="206" r="9" fill="#3498db"/>
    <circle cx="380" cy="240" r="26" fill="#fdf2e2" stroke="#e67e22"/>
    <circle cx="390" cy="244" r="9" fill="#3498db"/>
  </g>
  <text x="360" y="300" class="t" font-weight="bold">GEMs</text>
  <text x="345" y="318" class="s">(Gel bead-in-EMulsion)</text>
  <text x="345" y="333" class="s">empty / 1-bead+1-cell / etc.</text>

  <!-- inside a GEM -->
  <rect x="540" y="70" width="320" height="250" rx="10" fill="#fbfbfb" stroke="#bbb"/>
  <text x="555" y="95" class="t" font-weight="bold">Inside one GEM</text>
  <circle cx="700" cy="170" r="48" fill="none" stroke="#e67e22" stroke-dasharray="4 3"/>
  <circle cx="685" cy="160" r="16" fill="#27ae60"/><text x="685" y="164" text-anchor="middle" font-size="9" fill="#fff">cell</text>
  <circle cx="725" cy="185" r="14" fill="#3498db"/><text x="725" y="189" text-anchor="middle" font-size="8" fill="#fff">bead</text>
  <text x="555" y="250" class="s">1. cell lysed → mRNA released</text>
  <text x="555" y="270" class="s">2. bead releases barcoded primers (BC + UMI + polyT)</text>
  <text x="555" y="290" class="s">3. reverse transcription → barcoded cDNA</text>
  <text x="555" y="310" class="s">4. break emulsion, pool, build library</text>

  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e67e22"/></marker></defs>
</svg>
