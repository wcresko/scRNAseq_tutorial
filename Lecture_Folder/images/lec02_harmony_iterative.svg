<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13">
  <title>Harmony's 4-step iterative batch correction</title>
  <desc>After PCA, Harmony repeatedly: (a) soft-clusters cells while penalising single-batch clusters, (b) computes a global centroid per cluster, (c) computes per-batch correction factors, (d) shifts each cell using its soft-cluster assignment. Iterate until convergence.</desc>

  <!-- Top arrow indicating iteration loop -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2c3e50"/>
    </marker>
  </defs>

  <text x="550" y="22" text-anchor="middle" font-size="15" font-weight="600" fill="#2c3e50">Harmony — iterate steps a → d until convergence</text>
  <path d="M 1010 50 Q 1080 50 1080 180 Q 1080 310 1010 310 L 90 310 Q 20 310 20 180 Q 20 60 90 50" fill="none" stroke="#7f8c8d" stroke-width="1.4" stroke-dasharray="6 5" marker-end="url(#arr)"/>
  <text x="1080" y="180" text-anchor="middle" fill="#7f8c8d" font-size="11" transform="rotate(90 1080 180)">iterate</text>

  <!-- 4 panels -->
  <!-- Panel A: Soft-cluster -->
  <g transform="translate(40,55)">
    <rect width="240" height="220" rx="10" fill="#fdfdfd" stroke="#bdc3c7" stroke-width="1.4"/>
    <text x="120" y="22" text-anchor="middle" font-weight="600" fill="#2c3e50">a · Soft-cluster cells</text>
    <text x="120" y="42" text-anchor="middle" fill="#7f8c8d" font-size="11">batch-diversity penalty</text>
    <!-- Two batches mixed roughly -->
    <g>
      <!-- batch A: purple circles -->
      <circle cx="70" cy="90" r="4.5" fill="#8e44ad"/>
      <circle cx="83" cy="80" r="4.5" fill="#8e44ad"/>
      <circle cx="90" cy="100" r="4.5" fill="#8e44ad"/>
      <circle cx="160" cy="135" r="4.5" fill="#8e44ad"/>
      <circle cx="170" cy="150" r="4.5" fill="#8e44ad"/>
      <circle cx="155" cy="155" r="4.5" fill="#8e44ad"/>
      <circle cx="180" cy="125" r="4.5" fill="#8e44ad"/>
      <circle cx="100" cy="180" r="4.5" fill="#8e44ad"/>
      <circle cx="115" cy="190" r="4.5" fill="#8e44ad"/>
      <!-- batch B: orange triangles -->
      <polygon points="100,82 105,92 95,92" fill="#e67e22"/>
      <polygon points="78,103 83,113 73,113" fill="#e67e22"/>
      <polygon points="173,142 178,152 168,152" fill="#e67e22"/>
      <polygon points="150,140 155,150 145,150" fill="#e67e22"/>
      <polygon points="190,135 195,145 185,145" fill="#e67e22"/>
      <polygon points="105,170 110,180 100,180" fill="#e67e22"/>
      <polygon points="125,182 130,192 120,192" fill="#e67e22"/>
      <!-- soft cluster boundaries -->
      <ellipse cx="85" cy="92" rx="32" ry="22" fill="none" stroke="#3498db" stroke-width="1.6" stroke-dasharray="4 3"/>
      <ellipse cx="170" cy="142" rx="34" ry="22" fill="none" stroke="#27ae60" stroke-width="1.6" stroke-dasharray="4 3"/>
      <ellipse cx="115" cy="183" rx="28" ry="18" fill="none" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="4 3"/>
    </g>
  </g>

  <!-- Panel B: Centroids -->
  <g transform="translate(290,55)">
    <rect width="240" height="220" rx="10" fill="#fdfdfd" stroke="#bdc3c7" stroke-width="1.4"/>
    <text x="120" y="22" text-anchor="middle" font-weight="600" fill="#2c3e50">b · Compute centroids</text>
    <text x="120" y="42" text-anchor="middle" fill="#7f8c8d" font-size="11">global + per-batch per cluster</text>
    <!-- same cells -->
    <g opacity="0.45">
      <circle cx="70" cy="90" r="4.5" fill="#8e44ad"/>
      <circle cx="83" cy="80" r="4.5" fill="#8e44ad"/>
      <circle cx="90" cy="100" r="4.5" fill="#8e44ad"/>
      <circle cx="160" cy="135" r="4.5" fill="#8e44ad"/>
      <circle cx="170" cy="150" r="4.5" fill="#8e44ad"/>
      <circle cx="155" cy="155" r="4.5" fill="#8e44ad"/>
      <circle cx="100" cy="180" r="4.5" fill="#8e44ad"/>
      <polygon points="100,82 105,92 95,92" fill="#e67e22"/>
      <polygon points="78,103 83,113 73,113" fill="#e67e22"/>
      <polygon points="173,142 178,152 168,152" fill="#e67e22"/>
      <polygon points="150,140 155,150 145,150" fill="#e67e22"/>
      <polygon points="125,182 130,192 120,192" fill="#e67e22"/>
    </g>
    <!-- centroids -->
    <circle cx="85" cy="92" r="6" fill="#3498db" stroke="#2c3e50"/>
    <circle cx="73" cy="86" r="3.5" fill="#8e44ad"/>
    <circle cx="98" cy="100" r="3.5" fill="#e67e22"/>
    <circle cx="167" cy="142" r="6" fill="#27ae60" stroke="#2c3e50"/>
    <circle cx="158" cy="148" r="3.5" fill="#8e44ad"/>
    <circle cx="178" cy="138" r="3.5" fill="#e67e22"/>
    <circle cx="113" cy="183" r="6" fill="#c0392b" stroke="#2c3e50"/>
    <circle cx="103" cy="180" r="3.5" fill="#8e44ad"/>
    <circle cx="123" cy="187" r="3.5" fill="#e67e22"/>
    <!-- legend -->
    <g transform="translate(15,205)" font-size="10">
      <circle cx="6" cy="-3" r="5" fill="#3498db" stroke="#2c3e50"/>
      <text x="16" y="0" fill="#2c3e50">global centroid</text>
      <circle cx="125" cy="-3" r="3.5" fill="#7f8c8d"/>
      <text x="135" y="0" fill="#2c3e50">per-batch centroid</text>
    </g>
  </g>

  <!-- Panel C: Correction factors -->
  <g transform="translate(540,55)">
    <rect width="240" height="220" rx="10" fill="#fdfdfd" stroke="#bdc3c7" stroke-width="1.4"/>
    <text x="120" y="22" text-anchor="middle" font-weight="600" fill="#2c3e50">c · Correction factors</text>
    <text x="120" y="42" text-anchor="middle" fill="#7f8c8d" font-size="11">batch-centroid → global-centroid</text>
    <g opacity="0.35">
      <circle cx="73" cy="86" r="3.5" fill="#8e44ad"/>
      <circle cx="98" cy="100" r="3.5" fill="#e67e22"/>
      <circle cx="158" cy="148" r="3.5" fill="#8e44ad"/>
      <circle cx="178" cy="138" r="3.5" fill="#e67e22"/>
      <circle cx="103" cy="180" r="3.5" fill="#8e44ad"/>
      <circle cx="123" cy="187" r="3.5" fill="#e67e22"/>
    </g>
    <!-- arrows from per-batch centroid to global centroid -->
    <line x1="73" y1="86" x2="84" y2="92" stroke="#8e44ad" stroke-width="1.8" marker-end="url(#arr)"/>
    <line x1="98" y1="100" x2="86" y2="92" stroke="#e67e22" stroke-width="1.8" marker-end="url(#arr)"/>
    <line x1="158" y1="148" x2="167" y2="142" stroke="#8e44ad" stroke-width="1.8" marker-end="url(#arr)"/>
    <line x1="178" y1="138" x2="170" y2="142" stroke="#e67e22" stroke-width="1.8" marker-end="url(#arr)"/>
    <line x1="103" y1="180" x2="113" y2="183" stroke="#8e44ad" stroke-width="1.8" marker-end="url(#arr)"/>
    <line x1="123" y1="187" x2="116" y2="183" stroke="#e67e22" stroke-width="1.8" marker-end="url(#arr)"/>
    <!-- global centroids -->
    <circle cx="85" cy="92" r="5.5" fill="#3498db" stroke="#2c3e50"/>
    <circle cx="167" cy="142" r="5.5" fill="#27ae60" stroke="#2c3e50"/>
    <circle cx="113" cy="183" r="5.5" fill="#c0392b" stroke="#2c3e50"/>
  </g>

  <!-- Panel D: Move cells -->
  <g transform="translate(790,55)">
    <rect width="240" height="220" rx="10" fill="#fdfdfd" stroke="#bdc3c7" stroke-width="1.4"/>
    <text x="120" y="22" text-anchor="middle" font-weight="600" fill="#2c3e50">d · Move each cell</text>
    <text x="120" y="42" text-anchor="middle" fill="#7f8c8d" font-size="11">soft-cluster–weighted shift</text>
    <!-- before (faint) and after (solid) for a few cells -->
    <g opacity="0.25">
      <circle cx="70" cy="90" r="4.5" fill="#8e44ad"/>
      <circle cx="160" cy="135" r="4.5" fill="#8e44ad"/>
      <circle cx="100" cy="180" r="4.5" fill="#8e44ad"/>
      <polygon points="100,82 105,92 95,92" fill="#e67e22"/>
      <polygon points="173,142 178,152 168,152" fill="#e67e22"/>
      <polygon points="125,182 130,192 120,192" fill="#e67e22"/>
    </g>
    <!-- Shift arrows -->
    <line x1="70" y1="90" x2="82" y2="93" stroke="#8e44ad" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="160" y1="135" x2="170" y2="142" stroke="#8e44ad" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="100" y1="180" x2="112" y2="183" stroke="#8e44ad" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="100" y1="82" x2="89" y2="89" stroke="#e67e22" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="173" y1="142" x2="170" y2="143" stroke="#e67e22" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="125" y1="182" x2="118" y2="184" stroke="#e67e22" stroke-width="1.5" marker-end="url(#arr)"/>
    <!-- Cells AFTER, mixed at centroid -->
    <circle cx="83" cy="92" r="4.5" fill="#8e44ad"/>
    <circle cx="89" cy="89" r="4" fill="#e67e22"/>
    <circle cx="170" cy="142" r="4.5" fill="#8e44ad"/>
    <polygon points="170,138 175,148 165,148" fill="#e67e22"/>
    <circle cx="113" cy="183" r="4.5" fill="#8e44ad"/>
    <polygon points="118,180 123,190 113,190" fill="#e67e22"/>
    <text x="120" y="208" text-anchor="middle" fill="#27ae60" font-size="11" font-weight="600">batches now mixed within each cluster</text>
  </g>

  <!-- Caption -->
  <text x="550" y="345" text-anchor="middle" font-size="12" fill="#2c3e50">Adapted from Korsunsky et al. 2019 (Harmony, Nat Methods) — recreated as SVG. See also scNotebooks Module 05.</text>
</svg>
