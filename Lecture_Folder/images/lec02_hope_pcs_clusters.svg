<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" font-family="Helvetica,Arial,sans-serif">
  <style>.h{font-size:16px;font-weight:bold;fill:#2c3e50}.t{font-size:13px;font-weight:bold;fill:#2c3e50}.s{font-size:11px;fill:#555}</style>
  <text x="20" y="24" class="h">More PCs can resolve a real population — but more clusters isn't always better</text>

  <!-- 30 PCs -->
  <text x="120" y="58" text-anchor="middle" class="t">30 PCs</text>
  <rect x="30" y="70" width="340" height="190" rx="8" fill="#fbfbfb" stroke="#bbb"/>
  <g>
    <ellipse cx="110" cy="130" rx="42" ry="30" fill="#3498db" opacity="0.55"/>
    <ellipse cx="250" cy="135" rx="38" ry="28" fill="#27ae60" opacity="0.55"/>
    <ellipse cx="150" cy="210" rx="46" ry="30" fill="#e67e22" opacity="0.55"/>
    <ellipse cx="280" cy="205" rx="34" ry="24" fill="#9b59b6" opacity="0.55"/>
  </g>
  <text x="200" y="280" text-anchor="middle" class="s">4 clusters</text>

  <line x1="380" y1="165" x2="430" y2="165" stroke="#7f8c8d" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- 40 PCs -->
  <text x="610" y="58" text-anchor="middle" class="t">40 PCs</text>
  <rect x="450" y="70" width="340" height="190" rx="8" fill="#fbfbfb" stroke="#bbb"/>
  <g>
    <ellipse cx="530" cy="130" rx="42" ry="30" fill="#3498db" opacity="0.55"/>
    <ellipse cx="670" cy="135" rx="38" ry="28" fill="#27ae60" opacity="0.55"/>
    <ellipse cx="570" cy="210" rx="46" ry="30" fill="#e67e22" opacity="0.55"/>
    <ellipse cx="700" cy="205" rx="34" ry="24" fill="#9b59b6" opacity="0.55"/>
    <!-- the new split-out population -->
    <ellipse cx="690" cy="120" rx="20" ry="16" fill="#c0392b"/>
  </g>
  <text x="690" y="92" text-anchor="middle" class="s" fill="#c0392b">new cluster</text>
  <text x="620" y="280" text-anchor="middle" class="s">5 clusters — one is a real cell type</text>

  <text x="20" y="312" class="s">Seurat's advice: err on the higher side of PCs and re-run; confirm any new cluster has defensible markers before trusting it.</text>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7f8c8d"/></marker></defs>
</svg>
