<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" font-family="Helvetica,Arial,sans-serif">
  <style>.h{font-size:17px;font-weight:bold;fill:#2c3e50}.t{font-size:13px;fill:#2c3e50}.s{font-size:11px;fill:#555}.ok{font-size:12px;font-weight:bold;fill:#27ae60}.bad{font-size:12px;font-weight:bold;fill:#c0392b}</style>
  <text x="20" y="26" class="h">3′ capture piles reads at the 3′ end — so counts depend on the 3′ UTR annotation</text>

  <!-- Case A: well annotated -->
  <text x="40" y="64" class="ok">Well-annotated 3′ UTR → reads counted</text>
  <!-- gene model -->
  <line x1="40" y1="100" x2="500" y2="100" stroke="#7f8c8d" stroke-width="2"/>
  <rect x="60" y="90" width="60" height="20" fill="#2c3e50"/><rect x="180" y="90" width="60" height="20" fill="#2c3e50"/><rect x="300" y="90" width="60" height="20" fill="#2c3e50"/>
  <rect x="360" y="92" width="120" height="16" fill="#5dade2"/><text x="420" y="105" text-anchor="middle" class="s" fill="#fff">3′ UTR</text>
  <text x="60" y="84" class="s">exons</text>
  <!-- reads piling at 3' within UTR -->
  <g fill="#27ae60"><rect x="380" y="118" width="40" height="6"/><rect x="395" y="128" width="40" height="6"/><rect x="370" y="138" width="40" height="6"/><rect x="405" y="148" width="40" height="6"/></g>
  <text x="360" y="170" class="s" fill="#27ae60">reads land inside annotated UTR → assigned to the gene ✓</text>

  <!-- Case B: missing/truncated UTR -->
  <text x="40" y="220" class="bad">Missing / truncated 3′ UTR → reads lost</text>
  <line x1="40" y1="256" x2="500" y2="256" stroke="#7f8c8d" stroke-width="2"/>
  <rect x="60" y="246" width="60" height="20" fill="#2c3e50"/><rect x="180" y="246" width="60" height="20" fill="#2c3e50"/><rect x="300" y="246" width="60" height="20" fill="#2c3e50"/>
  <line x1="360" y1="256" x2="500" y2="256" stroke="#c0392b" stroke-dasharray="4 3" stroke-width="2"/>
  <text x="370" y="248" class="s" fill="#c0392b">UTR not annotated → "intergenic"</text>
  <g fill="#c0392b"><rect x="380" y="274" width="40" height="6"/><rect x="395" y="284" width="40" height="6"/><rect x="370" y="294" width="40" height="6"/><rect x="405" y="304" width="40" height="6"/></g>
  <text x="360" y="326" class="s" fill="#c0392b">reads fall outside the gene model → under-counted / invisible ✗</text>

  <!-- fix box -->
  <rect x="540" y="80" width="320" height="230" rx="10" fill="#f4f7fa" stroke="#bbb"/>
  <text x="556" y="106" class="t" font-weight="bold">Why it matters &amp; the fix</text>
  <text x="556" y="134" class="s">• Major problem in non-model systems</text>
  <text x="556" y="154" class="s">  (3′ UTRs poorly annotated)</text>
  <text x="556" y="178" class="s">• Can bite specific genes even in</text>
  <text x="556" y="196" class="s">  human / mouse</text>
  <text x="556" y="226" class="s">• Fix: extend 3′ UTR annotations with</text>
  <text x="556" y="244" class="s">  long-read Iso-Seq before quantifying</text>
  <text x="556" y="272" class="s">• Sanity-check that your marker genes'</text>
  <text x="556" y="290" class="s">  3′ ends are annotated</text>
</svg>
