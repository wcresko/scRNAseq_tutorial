<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" font-family="Helvetica,Arial,sans-serif">
  <style>.h{font-size:16px;font-weight:bold;fill:#2c3e50}.t{font-size:12px;fill:#2c3e50}.s{font-size:11px;fill:#555}</style>
  <text x="20" y="24" class="h">CCA + mutual nearest neighbours: anchors guide cross-dataset correction</text>

  <!-- 1: two datasets separate -->
  <text x="70" y="58" class="t" font-weight="bold">1 · two samples, separate</text>
  <g fill="#3498db"><circle cx="55" cy="110" r="5"/><circle cx="70" cy="130" r="5"/><circle cx="50" cy="150" r="5"/><circle cx="80" cy="160" r="5"/></g>
  <g fill="#e74c3c"><circle cx="150" cy="110" r="5"/><circle cx="165" cy="130" r="5"/><circle cx="145" cy="150" r="5"/><circle cx="175" cy="160" r="5"/></g>
  <text x="40" y="195" class="s" fill="#3498db">CTRL</text><text x="150" y="195" class="s" fill="#e74c3c">STIM</text>

  <line x1="205" y1="135" x2="245" y2="135" stroke="#7f8c8d" stroke-width="2" marker-end="url(#a)"/>

  <!-- 2: CCA shared space + MNN anchors -->
  <text x="280" y="58" class="t" font-weight="bold">2 · shared CCA space → find MNN anchors</text>
  <g fill="#3498db"><circle cx="300" cy="120" r="5"/><circle cx="330" cy="140" r="5"/><circle cx="315" cy="165" r="5"/></g>
  <g fill="#e74c3c"><circle cx="312" cy="128" r="5"/><circle cx="342" cy="148" r="5"/><circle cx="327" cy="172" r="5"/></g>
  <g stroke="#27ae60" stroke-width="2"><line x1="300" y1="120" x2="312" y2="128"/><line x1="330" y1="140" x2="342" y2="148"/><line x1="315" y1="165" x2="327" y2="172"/></g>
  <text x="285" y="205" class="s" fill="#27ae60">green links = mutual NN anchors (same cell type, different sample)</text>

  <line x1="470" y1="135" x2="510" y2="135" stroke="#7f8c8d" stroke-width="2" marker-end="url(#a)"/>

  <!-- 3: corrected/integrated -->
  <text x="560" y="58" class="t" font-weight="bold">3 · correction vectors → integrated</text>
  <g><circle cx="610" cy="120" r="5" fill="#3498db"/><circle cx="618" cy="124" r="5" fill="#e74c3c"/>
     <circle cx="640" cy="145" r="5" fill="#3498db"/><circle cx="648" cy="149" r="5" fill="#e74c3c"/>
     <circle cx="625" cy="170" r="5" fill="#3498db"/><circle cx="633" cy="174" r="5" fill="#e74c3c"/></g>
  <text x="560" y="205" class="s">samples now interleave within each cell type</text>

  <text x="20" y="270" class="s">Anchors that disagree with the global structure are down-weighted, so genuinely sample-specific populations resist being merged.</text>
  <text x="20" y="292" class="s">Harmony takes a different route: iteratively cluster, compute per-cluster dataset corrections in PCA space, repeat to convergence.</text>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7f8c8d"/></marker></defs>
</svg>
