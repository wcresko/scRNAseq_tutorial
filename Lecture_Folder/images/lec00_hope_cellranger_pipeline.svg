<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="Helvetica,Arial,sans-serif">
  <style>.h{font-size:17px;font-weight:bold;fill:#2c3e50}.b{font-size:11.5px;fill:#fff;font-weight:bold}.s{font-size:10.5px;fill:#555}.cap{font-size:12px;fill:#2c3e50}</style>
  <text x="20" y="26" class="h">cellranger count — the fixed pipeline from FASTQ to filtered matrix</text>

  <!-- step boxes -->
  <g>
    <rect x="20"  y="60" width="120" height="46" rx="6" fill="#34495e"/><text x="80"  y="80" text-anchor="middle" class="b">1 · Trim</text><text x="80" y="96" text-anchor="middle" class="b" font-size="9">TSO 5′ / polyA 3′</text>
    <rect x="160" y="60" width="120" height="46" rx="6" fill="#34495e"/><text x="220" y="80" text-anchor="middle" class="b">2 · STAR align</text><text x="220" y="96" text-anchor="middle" class="b" font-size="9">exon/intron/inter</text>
    <rect x="300" y="60" width="130" height="46" rx="6" fill="#34495e"/><text x="365" y="80" text-anchor="middle" class="b">3 · Transcriptome</text><text x="365" y="96" text-anchor="middle" class="b" font-size="9">MAPQ 255 · keep introns</text>
    <rect x="450" y="60" width="130" height="46" rx="6" fill="#2980b9"/><text x="515" y="80" text-anchor="middle" class="b">4 · BC correct</text><text x="515" y="96" text-anchor="middle" class="b" font-size="9">Hamming ≤1 → whitelist</text>
    <rect x="600" y="60" width="120" height="46" rx="6" fill="#2980b9"/><text x="660" y="80" text-anchor="middle" class="b">5 · UMI correct</text><text x="660" y="96" text-anchor="middle" class="b" font-size="9">collapse 1-bp</text>
    <rect x="740" y="60" width="140" height="46" rx="6" fill="#2980b9"/><text x="810" y="80" text-anchor="middle" class="b">6 · Count assign</text><text x="810" y="96" text-anchor="middle" class="b" font-size="9">(BC,UMI,gene)</text>
  </g>
  <!-- arrows row 1 -->
  <g stroke="#7f8c8d" stroke-width="2" marker-end="url(#a)"><line x1="140" y1="83" x2="158" y2="83"/><line x1="280" y1="83" x2="298" y2="83"/><line x1="430" y1="83" x2="448" y2="83"/><line x1="580" y1="83" x2="598" y2="83"/><line x1="720" y1="83" x2="738" y2="83"/></g>

  <!-- to unfiltered -->
  <line x1="810" y1="106" x2="810" y2="140" stroke="#7f8c8d" stroke-width="2" marker-end="url(#a)"/>
  <rect x="690" y="142" width="190" height="40" rx="6" fill="#7f8c8d"/><text x="785" y="166" text-anchor="middle" class="b">unfiltered matrix</text>

  <!-- cell calling -->
  <line x1="785" y1="182" x2="500" y2="210" stroke="#7f8c8d" stroke-width="2" marker-end="url(#a)"/>
  <rect x="300" y="200" width="200" height="56" rx="6" fill="#c0392b"/>
  <text x="400" y="222" text-anchor="middle" class="b">7 · Cell calling</text>
  <text x="400" y="240" text-anchor="middle" class="b" font-size="9">OrdMag (high counts)</text>
  <text x="400" y="252" text-anchor="middle" class="b" font-size="9">+ EmptyDrops (low counts)</text>
  <line x1="300" y1="228" x2="210" y2="228" stroke="#7f8c8d" stroke-width="2" marker-end="url(#a)"/>
  <rect x="20" y="206" width="180" height="44" rx="6" fill="#27ae60"/><text x="110" y="232" text-anchor="middle" class="b">filtered matrix → QC (Lec 01)</text>

  <text x="20" y="288" class="s">STARsolo / alevin-fry / kb-python reimplement the same logic. Cell-calling is not the last word — you still QC after.</text>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7f8c8d"/></marker></defs>
</svg>
