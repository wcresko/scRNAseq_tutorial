<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" font-family="Helvetica,Arial,sans-serif">
  <style>.h{font-size:17px;font-weight:bold;fill:#2c3e50}.t{font-size:14px;fill:#2c3e50}.s{font-size:12px;fill:#555}.n{font-size:12px;font-weight:bold;fill:#fff}</style>
  <text x="20" y="28" class="h">Ligand–receptor inference: which cell types are predicted to signal to which</text>

  <!-- Left: L-R mechanism -->
  <text x="40" y="62" class="t" font-weight="bold">Per cluster pair, score expressed L–R pairs</text>
  <!-- sender cell -->
  <circle cx="110" cy="140" r="42" fill="#3498db"/>
  <text x="110" y="145" text-anchor="middle" class="n">Sender</text>
  <!-- ligand -->
  <circle cx="152" cy="140" r="7" fill="#f1c40f" stroke="#b7950b"/>
  <text x="150" y="120" class="s" font-size="11">ligand</text>
  <!-- receiver cell -->
  <circle cx="300" cy="140" r="42" fill="#27ae60"/>
  <text x="300" y="145" text-anchor="middle" class="n">Receiver</text>
  <!-- receptor -->
  <rect x="251" y="133" width="14" height="14" rx="2" fill="#e74c3c" stroke="#922b21"/>
  <text x="232" y="120" class="s" font-size="11">receptor</text>
  <!-- arrow -->
  <line x1="162" y1="140" x2="248" y2="140" stroke="#7f8c8d" stroke-width="2.5" marker-end="url(#m)"/>
  <text x="60" y="210" class="s">score = f(ligand expr in sender × receptor expr in receiver)</text>
  <text x="60" y="230" class="s">significance from a permutation null (shuffle cluster labels)</text>

  <!-- Right: circle plot -->
  <text x="560" y="62" text-anchor="middle" class="t" font-weight="bold">Aggregated signaling network</text>
  <g>
    <!-- nodes on a circle centered (620,230) r=130 -->
    <circle cx="620" cy="100" r="26" fill="#e74c3c"/><text x="620" y="104" text-anchor="middle" class="n">T</text>
    <circle cx="730" cy="165" r="26" fill="#3498db"/><text x="730" y="169" text-anchor="middle" class="n">B</text>
    <circle cx="730" cy="295" r="26" fill="#9b59b6"/><text x="730" y="299" text-anchor="middle" class="n">NK</text>
    <circle cx="620" cy="360" r="26" fill="#27ae60"/><text x="620" y="364" text-anchor="middle" class="n">Mono</text>
    <circle cx="510" cy="295" r="26" fill="#e67e22"/><text x="510" y="299" text-anchor="middle" class="n">DC</text>
    <circle cx="510" cy="165" r="26" fill="#16a085"/><text x="510" y="169" text-anchor="middle" class="n">Fibro</text>
    <!-- directed edges, width ~ strength -->
    <g fill="none" marker-end="url(#m2)">
      <path d="M540,300 Q620,360 700,300" stroke="#e67e22" stroke-width="5"/>
      <path d="M620,126 Q700,140 726,140" stroke="#e74c3c" stroke-width="3"/>
      <path d="M524,190 Q560,260 600,346" stroke="#16a085" stroke-width="6"/>
      <path d="M730,191 Q740,230 730,269" stroke="#3498db" stroke-width="2.5"/>
      <path d="M596,118 Q540,140 528,150" stroke="#e74c3c" stroke-width="2.5"/>
    </g>
  </g>
  <text x="430" y="410" class="s">Node = cell type · arrow = predicted signal (sender→receiver) · width ≈ interaction strength</text>

  <defs>
    <marker id="m" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7f8c8d"/></marker>
    <marker id="m2" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#555"/></marker>
  </defs>
</svg>
