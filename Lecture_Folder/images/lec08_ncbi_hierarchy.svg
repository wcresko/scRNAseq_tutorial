<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 460" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13">
  <title>NCBI submission hierarchy for scRNA-seq</title>
  <desc>BioProject contains many BioSamples; each BioSample links to one or more SRA submissions (raw FASTQs) and to a GEO record (processed data). All four levels link by accession back to the BioProject.</desc>

  <defs>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2c3e50"/>
    </marker>
  </defs>

  <text x="550" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#2c3e50">NCBI submission hierarchy for an scRNA-seq study</text>

  <!-- BioProject (top) -->
  <g transform="translate(420,55)">
    <rect width="260" height="80" rx="10" fill="#34495e" stroke="#2c3e50" stroke-width="1.5"/>
    <text x="130" y="28" text-anchor="middle" fill="white" font-size="15" font-weight="700">BioProject</text>
    <text x="130" y="48" text-anchor="middle" fill="#bdc3c7" font-size="12">one per study</text>
    <text x="130" y="66" text-anchor="middle" fill="#ecf0f1" font-family="monospace" font-size="13">PRJNA######</text>
  </g>

  <!-- vertical down -->
  <line x1="550" y1="135" x2="550" y2="170" stroke="#2c3e50" stroke-width="1.6" marker-end="url(#arrA)"/>

  <!-- BioSamples (middle row) -->
  <g transform="translate(180,175)">
    <rect width="180" height="80" rx="10" fill="#3498db" stroke="#2c3e50" stroke-width="1.4"/>
    <text x="90" y="28" text-anchor="middle" fill="white" font-size="14" font-weight="700">BioSample · CTRL</text>
    <text x="90" y="46" text-anchor="middle" fill="#ecf0f1" font-size="11">tissue, donor, condition</text>
    <text x="90" y="64" text-anchor="middle" fill="#ecf0f1" font-family="monospace" font-size="12">SAMN########</text>
  </g>
  <g transform="translate(460,175)">
    <rect width="180" height="80" rx="10" fill="#3498db" stroke="#2c3e50" stroke-width="1.4"/>
    <text x="90" y="28" text-anchor="middle" fill="white" font-size="14" font-weight="700">BioSample · STIM</text>
    <text x="90" y="46" text-anchor="middle" fill="#ecf0f1" font-size="11">tissue, donor, condition</text>
    <text x="90" y="64" text-anchor="middle" fill="#ecf0f1" font-family="monospace" font-size="12">SAMN########</text>
  </g>
  <g transform="translate(740,175)">
    <rect width="180" height="80" rx="10" fill="#3498db" stroke="#2c3e50" stroke-width="1.4"/>
    <text x="90" y="28" text-anchor="middle" fill="white" font-size="14" font-weight="700">BioSample · ...</text>
    <text x="90" y="46" text-anchor="middle" fill="#ecf0f1" font-size="11">one per biological sample</text>
    <text x="90" y="64" text-anchor="middle" fill="#ecf0f1" font-family="monospace" font-size="12">SAMN########</text>
  </g>

  <!-- branching from BioProject down to each BioSample -->
  <line x1="550" y1="170" x2="270" y2="175" stroke="#2c3e50" stroke-width="1.4"/>
  <line x1="550" y1="170" x2="550" y2="175" stroke="#2c3e50" stroke-width="1.4"/>
  <line x1="550" y1="170" x2="830" y2="175" stroke="#2c3e50" stroke-width="1.4"/>

  <!-- SRA + GEO row -->
  <line x1="270" y1="255" x2="270" y2="305" stroke="#2c3e50" stroke-width="1.4" marker-end="url(#arrA)"/>
  <line x1="270" y1="255" x2="500" y2="305" stroke="#2c3e50" stroke-width="1.0" stroke-dasharray="3 3" marker-end="url(#arrA)"/>
  <line x1="550" y1="255" x2="500" y2="305" stroke="#2c3e50" stroke-width="1.4" marker-end="url(#arrA)"/>
  <line x1="550" y1="255" x2="730" y2="305" stroke="#2c3e50" stroke-width="1.0" stroke-dasharray="3 3" marker-end="url(#arrA)"/>
  <line x1="830" y1="255" x2="730" y2="305" stroke="#2c3e50" stroke-width="1.4" marker-end="url(#arrA)"/>

  <!-- SRA boxes -->
  <g transform="translate(180,310)">
    <rect width="180" height="80" rx="10" fill="#e67e22" stroke="#2c3e50" stroke-width="1.4"/>
    <text x="90" y="28" text-anchor="middle" fill="white" font-size="14" font-weight="700">SRA · raw FASTQ</text>
    <text x="90" y="46" text-anchor="middle" fill="#fff8e7" font-size="11">.fastq.gz, .bam</text>
    <text x="90" y="64" text-anchor="middle" fill="#fff8e7" font-family="monospace" font-size="12">SRR#######</text>
  </g>
  <g transform="translate(460,310)">
    <rect width="180" height="80" rx="10" fill="#27ae60" stroke="#2c3e50" stroke-width="1.4"/>
    <text x="90" y="28" text-anchor="middle" fill="white" font-size="14" font-weight="700">GEO · processed</text>
    <text x="90" y="46" text-anchor="middle" fill="#eafaf1" font-size="11">counts, cell metadata</text>
    <text x="90" y="64" text-anchor="middle" fill="#eafaf1" font-family="monospace" font-size="12">GSE######</text>
  </g>
  <g transform="translate(740,310)">
    <rect width="180" height="80" rx="10" fill="#8e44ad" stroke="#2c3e50" stroke-width="1.4"/>
    <text x="90" y="28" text-anchor="middle" fill="white" font-size="14" font-weight="700">CELLxGENE / HCA</text>
    <text x="90" y="46" text-anchor="middle" fill="#f5eef8" font-size="11">AnnData (.h5ad)</text>
    <text x="90" y="64" text-anchor="middle" fill="#f5eef8" font-family="monospace" font-size="12">UUID / dataset slug</text>
  </g>

  <!-- caption -->
  <text x="550" y="430" text-anchor="middle" fill="#7f8c8d" font-size="12">Solid arrows = required parent link · Dashed arrows = same biological samples surface in multiple repositories</text>
</svg>
