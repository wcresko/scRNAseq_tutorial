<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" font-family="Helvetica,Arial,sans-serif">
  <style>
    .t{font-size:15px;fill:#2c3e50}.s{font-size:12px;fill:#555}.h{font-size:17px;font-weight:bold;fill:#2c3e50}
    .lab{font-size:12px;font-weight:bold}
  </style>
  <text x="20" y="28" class="h">RNA velocity: nascent (unspliced) vs mature (spliced) mRNA predict a cell's near future</text>

  <!-- Left: molecular model -->
  <text x="40" y="62" class="t" font-weight="bold">1 · Within a cell</text>
  <!-- gene/transcription -->
  <rect x="40" y="80" width="300" height="150" rx="8" fill="#f4f7fa" stroke="#bbb"/>
  <!-- unspliced -->
  <text x="60" y="108" class="lab" fill="#e67e22">unspliced (introns)</text>
  <line x1="60" y1="118" x2="250" y2="118" stroke="#e67e22" stroke-width="6"/>
  <rect x="95" y="112" width="30" height="12" fill="#fff" stroke="#e67e22"/>
  <rect x="165" y="112" width="30" height="12" fill="#fff" stroke="#e67e22"/>
  <text x="60" y="150" class="s">newly transcribed → counted by intronic reads</text>
  <!-- arrow splicing -->
  <line x1="155" y1="160" x2="155" y2="185" stroke="#7f8c8d" stroke-width="3" marker-end="url(#a)"/>
  <text x="165" y="178" class="s">splicing</text>
  <!-- spliced -->
  <text x="60" y="205" class="lab" fill="#2980b9">spliced (mature)</text>
  <line x1="60" y1="215" x2="250" y2="215" stroke="#2980b9" stroke-width="6"/>
  <text x="60" y="226" class="s" font-size="11">exonic reads</text>

  <!-- balance logic -->
  <text x="370" y="100" class="t">High unspliced / spliced ratio</text>
  <text x="370" y="120" class="s">→ gene is turning <tspan font-weight="bold">on</tspan> (future ↑)</text>
  <text x="370" y="150" class="t">Low unspliced / spliced ratio</text>
  <text x="370" y="170" class="s">→ gene is turning <tspan font-weight="bold">off</tspan> (future ↓)</text>
  <text x="370" y="205" class="s" font-style="italic">velocyto / scVelo estimate this per gene,</text>
  <text x="370" y="222" class="s" font-style="italic">then combine into a per-cell velocity vector</text>

  <!-- Right: UMAP with velocity arrows -->
  <text x="430" y="270" class="t" font-weight="bold">2 · Velocity field on the embedding</text>
  <rect x="430" y="282" width="400" height="140" rx="8" fill="#fbfbfb" stroke="#bbb"/>
  <!-- cells as a curved trajectory -->
  <g fill="#bdc3c7">
    <circle cx="470" cy="390" r="5"/><circle cx="500" cy="378" r="5"/><circle cx="528" cy="368" r="5"/>
    <circle cx="558" cy="356" r="5"/><circle cx="588" cy="350" r="5"/><circle cx="620" cy="345" r="5"/>
    <circle cx="652" cy="338" r="5"/><circle cx="684" cy="330" r="5"/><circle cx="716" cy="320" r="5"/>
    <circle cx="748" cy="312" r="5"/><circle cx="778" cy="305" r="5"/>
  </g>
  <!-- velocity arrows along the path -->
  <g stroke="#c0392b" stroke-width="2.5" marker-end="url(#b)">
    <line x1="478" y1="388" x2="506" y2="377"/>
    <line x1="566" y1="354" x2="596" y2="349"/>
    <line x1="660" y1="336" x2="692" y2="328"/>
    <line x1="756" y1="310" x2="784" y2="303"/>
  </g>
  <text x="450" y="412" class="s">undifferentiated</text>
  <text x="700" y="300" class="s">differentiated →</text>
  <text x="440" y="278" class="s" font-size="11" fill="#c0392b">arrows = predicted direction of motion</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7f8c8d"/></marker>
    <marker id="b" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#c0392b"/></marker>
  </defs>
</svg>
