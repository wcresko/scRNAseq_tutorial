project:
  type: default
  output-dir: ../docs/Lecture_Folder
  # Render the real lecture decks but NOT the DupLec_* "holding decks" — those
  # are author-only scratch space for A/B-testing figures, not part of the
  # workshop, and should not be published as orphan pages in docs/.
  render:
    - "*.qmd"
    - "!DupLec_*.qmd"

# Applied to every lecture deck (merges with each lecture's own revealjs options).
# Injects a floating "← Materials" button (back_to_materials.html) on every slide
# so participants can return to the Materials page without the browser Back button.
format:
  revealjs:
    include-after-body: back_to_materials.html
