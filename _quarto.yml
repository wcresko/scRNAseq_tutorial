project:
  type: website
  output-dir: docs
  # Top-level pages and all Resources_Folder pages (appendices, Glossary,
  # VS Code reference) are rendered. Exercise_Folder .qmd files are NOT
  # rendered by this config; render_all.sh handles them in two ways:
  #   - Exercise_Folder/_quarto.yml renders each tutorial to .html for the
  #     student "View" link
  #   - render_all.sh copies the raw source as Tutorial_XX_…qmd.txt into
  #     docs/Exercise_Folder/ so the download link works without Quarto
  #     rewriting the .qmd href to .html
  render:
    - "*.qmd"
    - "Resources_Folder/*.qmd"
  resources:
    - "Exercise_Folder/*.tsv"
    - "Exercise_Folder/*.csv"
    - "Exercise_Folder/*.txt"
    - "Lecture_Folder/*.tsv"
    - "Lecture_Folder/*.csv"
    - "Lecture_Folder/*.txt"

website:
  title: "Single Cell RNA-seq Workshop"
  search:
    location: navbar
    type: overlay
  page-navigation: true
  back-to-top-navigation: true
  navbar:
    background: primary
    left:
      - href: index.qmd
        text: Home
      - about.qmd
      - href: Software_Setup.qmd
        text: Software Setup
      - Schedule.qmd
      - Lectures.qmd
      - Tutorials.qmd
      - Readings.qmd
      - Materials.qmd
      - href: Additional_Resources.qmd
        text: Additional Resources
    right:
      - icon: github
        href: https://github.com/wcresko/scRNAseq_tutorial
        aria-label: GitHub
  page-footer:
    left: "© Single Cell RNA-seq Workshop"
    center: '[![](/images/cbds_logo.png){height=34px fig-alt="Center for Biomedical Data Science (CBDS)"}](https://knightcampus.uoregon.edu/cbds)'
    right: "Built with [Quarto](https://quarto.org)"

format:
  html:
    theme:
      light: cerulean
      dark: darkly
    css: styles.css
    toc: true
    toc-location: left
    toc-depth: 3
    embed-resources: true
    code-copy: true
    code-overflow: wrap
    smooth-scroll: true
    anchor-sections: true

editor: visual
