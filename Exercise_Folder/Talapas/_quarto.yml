# Exercise_Folder/Talapas/_quarto.yml
#
# Renders the Talapas Advanced tutorials to HTML for the student "View"
# links. Sources live alongside this file; rendered output lands in
# docs/Exercise_Folder/Talapas/.
#
# Usage:
#   cd Exercise_Folder/Talapas
#   quarto render

project:
  type: default
  output-dir: ../../docs/Exercise_Folder/Talapas

format:
  html:
    toc: true
    toc-depth: 3
    code-fold: false
    code-overflow: wrap
    highlight-style: github
    embed-resources: true

execute:
  eval: false
  echo: true
  warning: false
  message: false

editor: visual
