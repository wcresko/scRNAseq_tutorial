<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" font-family="Helvetica,Arial,sans-serif">
  <style>
    .h{font-size:17px;font-weight:bold;fill:#2c3e50}
    .lab{font-size:12.5px;font-weight:bold;fill:#fff}
    .s{font-size:11px;fill:#555}.mono{font-family:Consolas,monospace;font-size:10.5px;fill:#2c3e50}
  </style>
  <text x="20" y="26" class="h">The SLURM batch job lifecycle on Talapas</text>

  <!-- login node -->
  <rect x="20" y="70" width="150" height="80" rx="8" fill="#34495e"/>
  <text x="95" y="104" text-anchor="middle" class="lab">Login node</text>
  <text x="95" y="124" text-anchor="middle" class="lab" font-size="10" font-weight="normal">edit · submit only</text>

  <!-- arrow sbatch -->
  <path d="M170,110 l60,0" stroke="#1c7293" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="200" y="100" text-anchor="middle" class="mono">sbatch</text>

  <!-- queue -->
  <rect x="232" y="70" width="170" height="80" rx="8" fill="#e67e22"/>
  <text x="317" y="100" text-anchor="middle" class="lab">SLURM queue</text>
  <text x="317" y="120" text-anchor="middle" class="lab" font-size="10" font-weight="normal">waiting · state PD</text>
  <text x="317" y="135" text-anchor="middle" class="lab" font-size="10" font-weight="normal">(priority / resources)</text>

  <!-- arrow scheduled -->
  <path d="M402,110 l60,0" stroke="#1c7293" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="432" y="100" text-anchor="middle" class="s">scheduled</text>

  <!-- compute node -->
  <rect x="464" y="70" width="170" height="80" rx="8" fill="#27ae60"/>
  <text x="549" y="100" text-anchor="middle" class="lab">Compute node</text>
  <text x="549" y="120" text-anchor="middle" class="lab" font-size="10" font-weight="normal">running · state R</text>
  <text x="549" y="135" text-anchor="middle" class="lab" font-size="10" font-weight="normal">module load R; Rscript …</text>

  <!-- arrow outputs -->
  <path d="M634,110 l60,0" stroke="#1c7293" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- outputs -->
  <rect x="696" y="70" width="220" height="80" rx="8" fill="#2c3e50"/>
  <text x="806" y="98" text-anchor="middle" class="lab">Outputs + logs</text>
  <text x="806" y="118" text-anchor="middle" class="lab" font-size="10" font-weight="normal">results (.pdf / .csv / .rds)</text>
  <text x="806" y="134" text-anchor="middle" class="lab" font-size="10" font-weight="normal">logs/&lt;name&gt;_&lt;jobid&gt;.out / .err</text>

  <!-- monitoring band -->
  <rect x="20" y="190" width="896" height="118" rx="8" fill="#f7f9fb" stroke="#cdd7df"/>
  <text x="36" y="214" class="h" font-size="14">Watch and control it from the login node</text>
  <text x="36" y="240" class="mono">squeue -u $USER</text><text x="220" y="240" class="s">— list your jobs and their state (PD / R / CG)</text>
  <text x="36" y="262" class="mono">scancel &lt;jobid&gt;</text><text x="220" y="262" class="s">— cancel a queued or running job (find the id with squeue)</text>
  <text x="36" y="284" class="mono">cat logs/&lt;name&gt;_&lt;jobid&gt;.out</text><text x="220" y="284" class="s">— read output / errors after it finishes (or open in VS Code)</text>
  <text x="36" y="303" class="s" font-style="italic">A very short job may finish before it ever shows up in squeue.</text>

  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1c7293"/></marker></defs>
</svg>
