<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13">
  <title>End-to-end scRNA-seq submission workflow</title>
  <desc>Seven steps from project setup to multi-repository deposit, with the canonical metadata sheet feeding all of them.</desc>

  <defs>
    <marker id="arrW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2c3e50"/>
    </marker>
  </defs>

  <text x="600" y="26" text-anchor="middle" font-size="16" font-weight="600" fill="#2c3e50">A complete scRNA-seq submission, end to end</text>

  <!-- Top row: 4 sequential setup steps -->
  <g transform="translate(40,55)">
    <rect width="220" height="80" rx="10" fill="#ecf0f1" stroke="#34495e"/>
    <text x="110" y="22" text-anchor="middle" font-weight="700" fill="#2c3e50">1 · Plan</text>
    <text x="110" y="42" text-anchor="middle" font-size="11" fill="#2c3e50">Design the canonical</text>
    <text x="110" y="58" text-anchor="middle" font-size="11" fill="#2c3e50">metadata sheet at</text>
    <text x="110" y="74" text-anchor="middle" font-size="11" fill="#2c3e50">experimental design time</text>
  </g>
  <line x1="265" y1="95" x2="295" y2="95" stroke="#2c3e50" stroke-width="1.6" marker-end="url(#arrW)"/>

  <g transform="translate(300,55)">
    <rect width="220" height="80" rx="10" fill="#ecf0f1" stroke="#34495e"/>
    <text x="110" y="22" text-anchor="middle" font-weight="700" fill="#2c3e50">2 · BioProject</text>
    <text x="110" y="42" text-anchor="middle" font-size="11" fill="#2c3e50">Create one PRJNA</text>
    <text x="110" y="58" text-anchor="middle" font-size="11" fill="#2c3e50">at submit.ncbi.nlm.nih.gov</text>
  </g>
  <line x1="525" y1="95" x2="555" y2="95" stroke="#2c3e50" stroke-width="1.6" marker-end="url(#arrW)"/>

  <g transform="translate(560,55)">
    <rect width="220" height="80" rx="10" fill="#ecf0f1" stroke="#34495e"/>
    <text x="110" y="22" text-anchor="middle" font-weight="700" fill="#2c3e50">3 · BioSamples</text>
    <text x="110" y="42" text-anchor="middle" font-size="11" fill="#2c3e50">One SAMN per sample</text>
    <text x="110" y="58" text-anchor="middle" font-size="11" fill="#2c3e50">batch upload .tsv from</text>
    <text x="110" y="74" text-anchor="middle" font-size="11" fill="#2c3e50">canonical sheet</text>
  </g>
  <line x1="785" y1="95" x2="815" y2="95" stroke="#2c3e50" stroke-width="1.6" marker-end="url(#arrW)"/>

  <g transform="translate(820,55)">
    <rect width="220" height="80" rx="10" fill="#fdf2e9" stroke="#e67e22"/>
    <text x="110" y="22" text-anchor="middle" font-weight="700" fill="#2c3e50">4 · SRA</text>
    <text x="110" y="42" text-anchor="middle" font-size="11" fill="#2c3e50">Upload .fastq.gz</text>
    <text x="110" y="58" text-anchor="middle" font-size="11" fill="#2c3e50">link each to its SAMN</text>
  </g>

  <!-- Vertical down arrow -->
  <line x1="930" y1="135" x2="930" y2="165" stroke="#2c3e50" stroke-width="1.6" marker-end="url(#arrW)"/>

  <!-- Bottom row: process + 2 deposits -->
  <g transform="translate(820,170)">
    <rect width="220" height="80" rx="10" fill="#ecf0f1" stroke="#34495e"/>
    <text x="110" y="22" text-anchor="middle" font-weight="700" fill="#2c3e50">5 · Analyze</text>
    <text x="110" y="42" text-anchor="middle" font-size="11" fill="#2c3e50">Cell Ranger → Seurat</text>
    <text x="110" y="58" text-anchor="middle" font-size="11" fill="#2c3e50">QC → cluster → annotate</text>
    <text x="110" y="74" text-anchor="middle" font-size="11" fill="#2c3e50">(Tutorials 01–09)</text>
  </g>
  <line x1="815" y1="210" x2="785" y2="210" stroke="#2c3e50" stroke-width="1.6" marker-end="url(#arrW)"/>

  <g transform="translate(560,170)">
    <rect width="220" height="80" rx="10" fill="#eafaf1" stroke="#27ae60"/>
    <text x="110" y="22" text-anchor="middle" font-weight="700" fill="#2c3e50">6 · GEO</text>
    <text x="110" y="42" text-anchor="middle" font-size="11" fill="#2c3e50">Counts matrices +</text>
    <text x="110" y="58" text-anchor="middle" font-size="11" fill="#2c3e50">per-cell metadata</text>
    <text x="110" y="74" text-anchor="middle" font-size="11" fill="#2c3e50">links to BioProject + SRA</text>
  </g>
  <line x1="555" y1="210" x2="525" y2="210" stroke="#2c3e50" stroke-width="1.6" marker-end="url(#arrW)"/>

  <g transform="translate(300,170)">
    <rect width="220" height="80" rx="10" fill="#f5eef8" stroke="#8e44ad"/>
    <text x="110" y="22" text-anchor="middle" font-weight="700" fill="#2c3e50">7 · CELLxGENE / HCA</text>
    <text x="110" y="42" text-anchor="middle" font-size="11" fill="#2c3e50">Convert Seurat → AnnData</text>
    <text x="110" y="58" text-anchor="middle" font-size="11" fill="#2c3e50">apply schema validator</text>
    <text x="110" y="74" text-anchor="middle" font-size="11" fill="#2c3e50">submit .h5ad</text>
  </g>
  <line x1="295" y1="210" x2="265" y2="210" stroke="#2c3e50" stroke-width="1.6" marker-end="url(#arrW)"/>

  <g transform="translate(40,170)">
    <rect width="220" height="80" rx="10" fill="#fdedec" stroke="#c0392b"/>
    <text x="110" y="22" text-anchor="middle" font-weight="700" fill="#2c3e50">8 · Cite all accessions</text>
    <text x="110" y="42" text-anchor="middle" font-size="11" fill="#2c3e50">in manuscript Data</text>
    <text x="110" y="58" text-anchor="middle" font-size="11" fill="#2c3e50">Availability section</text>
  </g>

  <!-- Caption -->
  <text x="600" y="295" text-anchor="middle" font-size="13" fill="#2c3e50" font-weight="600">The canonical metadata sheet (Step 1) feeds Steps 3, 4, 6, 7</text>
  <text x="600" y="315" text-anchor="middle" font-size="12" fill="#7f8c8d">— write it once at experimental design, version-control it, never re-derive it from spreadsheets at the end —</text>
  <text x="600" y="350" text-anchor="middle" font-size="12" fill="#7f8c8d">Tutorial 13 walks Steps 1, 6, and 7 hands-on with the workshop's ifnb_annotated_final.rds</text>
</svg>
