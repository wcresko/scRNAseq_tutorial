<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" font-family="Helvetica,Arial,sans-serif">
  <style>.h{font-size:17px;font-weight:bold;fill:#2c3e50}.t{font-size:13px;fill:#2c3e50}.s{font-size:11px;fill:#555}.lab{font-size:12px;font-weight:bold;fill:#fff}</style>
  <text x="20" y="26" class="h">Anatomy of a 10x 3′ read pair — where the barcode, UMI, and cDNA live</text>

  <!-- Read 1 -->
  <text x="40" y="70" class="t" font-weight="bold">Read 1  (≈28 bp — identity only)</text>
  <rect x="40" y="80" width="150" height="34" fill="#3498db"/><text x="115" y="102" text-anchor="middle" class="lab">Cell barcode</text>
  <rect x="190" y="80" width="95" height="34" fill="#9b59b6"/><text x="237" y="102" text-anchor="middle" class="lab">UMI</text>
  <rect x="285" y="80" width="60" height="34" fill="#95a5a6"/><text x="315" y="102" text-anchor="middle" class="lab" font-size="10">polyT</text>
  <text x="40" y="132" class="s">16 bp barcode → which cell · 12 bp UMI → which molecule</text>

  <!-- Read 2 -->
  <text x="40" y="178" class="t" font-weight="bold">Read 2  (≈90 bp sequenced — the transcript)</text>
  <rect x="40" y="188" width="70" height="34" fill="#bdc3c7"/><text x="75" y="210" text-anchor="middle" class="lab" font-size="9" fill="#2c3e50">TSO</text>
  <rect x="110" y="188" width="430" height="34" fill="#27ae60"/><text x="325" y="210" text-anchor="middle" class="lab">cDNA insert (gene body, 3′ end)</text>
  <rect x="540" y="188" width="70" height="34" fill="#95a5a6"/><text x="575" y="210" text-anchor="middle" class="lab" font-size="9">polyA</text>
  <text x="40" y="240" class="s">trim TSO (5′) and polyA (3′) before alignment</text>

  <!-- insert size note -->
  <line x1="110" y1="262" x2="610" y2="262" stroke="#7f8c8d" stroke-width="1.5" marker-start="url(#l)" marker-end="url(#r)"/>
  <text x="360" y="280" text-anchor="middle" class="s">insert ≈ 250–550 bp (mean ~350); only ~90 bp is sequenced</text>
  <text x="40" y="312" class="s">Because only the 3′ end is read, counts depend on accurate 3′-end gene models (see 3′ UTR slide).</text>

  <defs>
    <marker id="l" markerWidth="8" markerHeight="8" refX="1" refY="3" orient="auto"><path d="M6,0 L0,3 L6,6 Z" fill="#7f8c8d"/></marker>
    <marker id="r" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7f8c8d"/></marker>
  </defs>
</svg>
