<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 460" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13">
  <title>Seurat anchor-based integration (CCA + L2 + MNN)</title>
  <desc>Two datasets are projected by canonical correlation analysis into a shared low-rank space. After L2 normalization, mutual nearest neighbours across the two datasets become "anchors". Each anchor is scored by how well it sits in the local neighbourhood of both datasets. High-scoring anchors drive the alignment.</desc>

  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2c3e50"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#27ae60"/>
    </marker>
  </defs>

  <text x="550" y="22" text-anchor="middle" font-size="15" font-weight="600" fill="#2c3e50">Seurat anchor-based integration — CCA, mutual nearest neighbours, anchor scoring</text>

  <!-- A: original sample manifolds -->
  <g transform="translate(30,55)">
    <rect width="200" height="200" rx="8" fill="#fdfdfd" stroke="#bdc3c7"/>
    <text x="100" y="20" text-anchor="middle" font-weight="600" fill="#2c3e50">A · Two samples</text>
    <text x="100" y="36" text-anchor="middle" fill="#8e44ad" font-size="11">Sample 1 (purple)</text>
    <text x="100" y="50" text-anchor="middle" fill="#27ae60" font-size="11">Sample 2 (green)</text>
    <!-- Sample 1 manifold: 3 cell-type clouds, slightly shifted -->
    <g fill="#8e44ad">
      <circle cx="50" cy="80" r="3.5"/><circle cx="58" cy="92" r="3.5"/><circle cx="46" cy="92" r="3.5"/>
      <circle cx="55" cy="100" r="3.5"/><circle cx="62" cy="85" r="3.5"/>
      <circle cx="120" cy="125" r="3.5"/><circle cx="128" cy="130" r="3.5"/><circle cx="115" cy="135" r="3.5"/>
      <circle cx="135" cy="120" r="3.5"/><circle cx="140" cy="135" r="3.5"/>
      <circle cx="80" cy="160" r="3.5"/><circle cx="88" cy="172" r="3.5"/><circle cx="76" cy="172" r="3.5"/>
      <circle cx="92" cy="165" r="3.5"/>
    </g>
    <!-- Sample 2 -->
    <g fill="#27ae60">
      <circle cx="65" cy="78" r="3.5"/><circle cx="72" cy="86" r="3.5"/><circle cx="80" cy="78" r="3.5"/>
      <circle cx="138" cy="110" r="3.5"/><circle cx="148" cy="118" r="3.5"/><circle cx="155" cy="128" r="3.5"/>
      <circle cx="100" cy="155" r="3.5"/><circle cx="108" cy="165" r="3.5"/><circle cx="100" cy="172" r="3.5"/>
    </g>
  </g>

  <!-- arrow A -> B -->
  <text x="245" y="155" text-anchor="middle" fill="#7f8c8d" font-size="11">CCA + L2</text>
  <line x1="240" y1="170" x2="280" y2="170" stroke="#2c3e50" stroke-width="1.6" marker-end="url(#arr2)"/>

  <!-- B: shared CCA space -->
  <g transform="translate(290,55)">
    <rect width="200" height="200" rx="8" fill="#fdfdfd" stroke="#bdc3c7"/>
    <text x="100" y="20" text-anchor="middle" font-weight="600" fill="#2c3e50">B · CCA shared space</text>
    <text x="100" y="36" text-anchor="middle" fill="#7f8c8d" font-size="11">structure aligned, not yet matched</text>
    <!-- Mixed clouds, much closer -->
    <g fill="#8e44ad">
      <circle cx="55" cy="85" r="3.5"/><circle cx="63" cy="92" r="3.5"/><circle cx="50" cy="95" r="3.5"/>
      <circle cx="125" cy="125" r="3.5"/><circle cx="135" cy="120" r="3.5"/><circle cx="130" cy="135" r="3.5"/>
      <circle cx="90" cy="158" r="3.5"/><circle cx="80" cy="168" r="3.5"/><circle cx="98" cy="170" r="3.5"/>
    </g>
    <g fill="#27ae60">
      <circle cx="60" cy="80" r="3.5"/><circle cx="68" cy="88" r="3.5"/><circle cx="56" cy="100" r="3.5"/>
      <circle cx="130" cy="120" r="3.5"/><circle cx="140" cy="128" r="3.5"/><circle cx="128" cy="140" r="3.5"/>
      <circle cx="92" cy="162" r="3.5"/><circle cx="84" cy="172" r="3.5"/><circle cx="100" cy="166" r="3.5"/>
    </g>
  </g>

  <text x="505" y="155" text-anchor="middle" fill="#7f8c8d" font-size="11">find MNN</text>
  <line x1="500" y1="170" x2="540" y2="170" stroke="#2c3e50" stroke-width="1.6" marker-end="url(#arr2)"/>

  <!-- C: anchors -->
  <g transform="translate(550,55)">
    <rect width="220" height="200" rx="8" fill="#fdfdfd" stroke="#bdc3c7"/>
    <text x="110" y="20" text-anchor="middle" font-weight="600" fill="#2c3e50">C · Mutual nearest neighbours</text>
    <text x="110" y="36" text-anchor="middle" fill="#7f8c8d" font-size="11">cross-sample anchors</text>
    <!-- cells -->
    <g fill="#8e44ad">
      <circle cx="60" cy="85" r="4" id="p1"/>
      <circle cx="135" cy="125" r="4" id="p2"/>
      <circle cx="90" cy="160" r="4" id="p3"/>
    </g>
    <g fill="#27ae60">
      <circle cx="68" cy="80" r="4" id="g1"/>
      <circle cx="140" cy="128" r="4" id="g2"/>
      <circle cx="92" cy="162" r="4" id="g3"/>
    </g>
    <!-- anchor lines -->
    <line x1="60" y1="85" x2="68" y2="80" stroke="#2c3e50" stroke-width="1.4"/>
    <line x1="135" y1="125" x2="140" y2="128" stroke="#2c3e50" stroke-width="1.4"/>
    <line x1="90" y1="160" x2="92" y2="162" stroke="#2c3e50" stroke-width="1.4"/>
    <!-- One bad anchor crossing far -->
    <circle cx="60" cy="160" r="4" fill="#8e44ad" stroke="#c0392b" stroke-width="1.5"/>
    <circle cx="160" cy="80" r="4" fill="#27ae60" stroke="#c0392b" stroke-width="1.5"/>
    <line x1="60" y1="160" x2="160" y2="80" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="4 3"/>
    <text x="110" y="187" text-anchor="middle" fill="#c0392b" font-size="10">low-scoring anchor (filtered out)</text>
  </g>

  <!-- D: high vs low scoring detail (bottom row) -->
  <g transform="translate(30,290)">
    <rect width="500" height="150" rx="8" fill="#fdfdfd" stroke="#bdc3c7"/>
    <text x="250" y="20" text-anchor="middle" font-weight="600" fill="#2c3e50">D · Anchor scoring — does the anchor's neighbourhood agree?</text>

    <!-- Left: high-scoring -->
    <g transform="translate(20,40)">
      <text x="100" y="0" text-anchor="middle" font-size="11" fill="#27ae60" font-weight="600">High-scoring anchor</text>
      <!-- purple cluster -->
      <circle cx="50" cy="50" r="6" fill="#8e44ad"/>
      <circle cx="40" cy="40" r="3" fill="#8e44ad"/>
      <circle cx="60" cy="40" r="3" fill="#8e44ad"/>
      <circle cx="40" cy="62" r="3" fill="#8e44ad"/>
      <circle cx="60" cy="62" r="3" fill="#8e44ad"/>
      <!-- green cluster -->
      <circle cx="150" cy="50" r="6" fill="#27ae60"/>
      <circle cx="140" cy="40" r="3" fill="#27ae60"/>
      <circle cx="160" cy="40" r="3" fill="#27ae60"/>
      <circle cx="140" cy="62" r="3" fill="#27ae60"/>
      <circle cx="160" cy="62" r="3" fill="#27ae60"/>
      <!-- arrows showing neighbourhood agreement -->
      <line x1="50" y1="50" x2="150" y2="50" stroke="#27ae60" stroke-width="1.4" marker-end="url(#arrG)"/>
      <line x1="40" y1="40" x2="140" y2="40" stroke="#27ae60" stroke-width="1.0" stroke-dasharray="2 2"/>
      <line x1="60" y1="62" x2="160" y2="62" stroke="#27ae60" stroke-width="1.0" stroke-dasharray="2 2"/>
      <text x="100" y="100" text-anchor="middle" font-size="10" fill="#7f8c8d">neighbours of A also map to neighbours of B</text>
    </g>

    <!-- Right: low-scoring -->
    <g transform="translate(260,40)">
      <text x="100" y="0" text-anchor="middle" font-size="11" fill="#c0392b" font-weight="600">Low-scoring anchor</text>
      <circle cx="50" cy="50" r="6" fill="#8e44ad"/>
      <circle cx="40" cy="40" r="3" fill="#8e44ad"/>
      <circle cx="60" cy="40" r="3" fill="#8e44ad"/>
      <circle cx="40" cy="62" r="3" fill="#8e44ad"/>
      <circle cx="60" cy="62" r="3" fill="#8e44ad"/>
      <circle cx="150" cy="50" r="6" fill="#27ae60"/>
      <circle cx="140" cy="20" r="3" fill="#27ae60"/>
      <circle cx="180" cy="38" r="3" fill="#27ae60"/>
      <circle cx="140" cy="80" r="3" fill="#27ae60"/>
      <circle cx="180" cy="78" r="3" fill="#27ae60"/>
      <line x1="50" y1="50" x2="150" y2="50" stroke="#c0392b" stroke-width="1.4" marker-end="url(#arrR)"/>
      <line x1="40" y1="40" x2="140" y2="20" stroke="#c0392b" stroke-width="1.0" stroke-dasharray="2 2"/>
      <line x1="60" y1="62" x2="180" y2="78" stroke="#c0392b" stroke-width="1.0" stroke-dasharray="2 2"/>
      <text x="100" y="100" text-anchor="middle" font-size="10" fill="#7f8c8d">neighbours scatter — anchor down-weighted</text>
    </g>
  </g>

  <!-- E: aligned -->
  <g transform="translate(560,290)">
    <rect width="220" height="150" rx="8" fill="#fdfdfd" stroke="#bdc3c7"/>
    <text x="110" y="20" text-anchor="middle" font-weight="600" fill="#2c3e50">E · Aligned embedding</text>
    <text x="110" y="36" text-anchor="middle" fill="#7f8c8d" font-size="11">cells co-cluster by type, not by sample</text>
    <g>
      <circle cx="60" cy="80" r="3.5" fill="#8e44ad"/>
      <circle cx="62" cy="82" r="3.5" fill="#27ae60"/>
      <circle cx="68" cy="78" r="3.5" fill="#8e44ad"/>
      <circle cx="70" cy="84" r="3.5" fill="#27ae60"/>
      <circle cx="74" cy="80" r="3.5" fill="#8e44ad"/>
      <circle cx="135" cy="100" r="3.5" fill="#8e44ad"/>
      <circle cx="138" cy="103" r="3.5" fill="#27ae60"/>
      <circle cx="142" cy="98" r="3.5" fill="#8e44ad"/>
      <circle cx="145" cy="105" r="3.5" fill="#27ae60"/>
      <circle cx="100" cy="125" r="3.5" fill="#8e44ad"/>
      <circle cx="103" cy="128" r="3.5" fill="#27ae60"/>
      <circle cx="108" cy="123" r="3.5" fill="#8e44ad"/>
      <circle cx="106" cy="130" r="3.5" fill="#27ae60"/>
    </g>
  </g>

  <text x="550" y="455" text-anchor="middle" font-size="12" fill="#2c3e50">Adapted from Stuart, Butler et al. 2019 (Seurat v3, Cell) — recreated as SVG. Pairs with Tutorial 04.</text>
</svg>
