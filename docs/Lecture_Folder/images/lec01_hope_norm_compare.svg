<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" font-family="Helvetica,Arial,sans-serif">
  <style>.h{font-size:16px;font-weight:bold;fill:#2c3e50}.t{font-size:13px;font-weight:bold;fill:#2c3e50}.s{font-size:11px;fill:#555}.ax{font-size:10px;fill:#888}</style>
  <text x="20" y="24" class="h">Log-normalization vs. SCTransform — residual variance across expression levels</text>

  <!-- Panel 1: NormalizeData -->
  <text x="30" y="56" class="t">NormalizeData (log-norm)</text>
  <line x1="60" y1="260" x2="400" y2="260" stroke="#333"/><line x1="60" y1="80" x2="60" y2="260" stroke="#333"/>
  <text x="230" y="288" text-anchor="middle" class="ax">mean expression (low → high)</text>
  <text x="44" y="170" class="ax" transform="rotate(-90 44 170)">residual variance</text>
  <!-- ideal flat line -->
  <line x1="60" y1="200" x2="400" y2="200" stroke="#27ae60" stroke-dasharray="5 4"/>
  <text x="300" y="194" class="s" fill="#27ae60">target: flat</text>
  <!-- actual: rises for high-expression genes -->
  <path d="M60,205 C160,205 260,200 320,165 S390,110 400,100" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <text x="250" y="120" class="s" fill="#c0392b">medium/high genes</text>
  <text x="250" y="136" class="s" fill="#c0392b">not fully normalized</text>

  <!-- Panel 2: SCTransform -->
  <text x="470" y="56" class="t">SCTransform (GLM residuals)</text>
  <line x1="500" y1="260" x2="840" y2="260" stroke="#333"/><line x1="500" y1="80" x2="500" y2="260" stroke="#333"/>
  <text x="670" y="288" text-anchor="middle" class="ax">mean expression (low → high)</text>
  <line x1="500" y1="200" x2="840" y2="200" stroke="#27ae60" stroke-dasharray="5 4"/>
  <!-- actual: stays flat -->
  <path d="M500,203 C600,199 700,201 760,198 S820,202 840,200" fill="none" stroke="#2980b9" stroke-width="2.5"/>
  <text x="660" y="186" class="s" fill="#2980b9">flat across all expression levels</text>

  <text x="30" y="320" class="s">Log-norm assumes equal RNA per cell &amp; removes depth, but leaves a mean–variance trend; SCTransform regularizes a per-gene NB GLM so genes at every abundance are stabilized.</text>
</svg>
