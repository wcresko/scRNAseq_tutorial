<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="Helvetica,Arial,sans-serif">
  <style>
    .h{font-size:18px;font-weight:bold;fill:#2c3e50}
    .step{font-size:14px;font-weight:bold;fill:#1c7293}
    .t{font-size:12px;fill:#2c3e50}.s{font-size:11px;fill:#555}.mono{font-family:Consolas,monospace;font-size:11px;fill:#2c3e50}
    .panel{fill:#f7f9fb;stroke:#cdd7df}
  </style>
  <text x="20" y="26" class="h">Connecting VS Code to Talapas over Remote-SSH</text>

  <!-- Panel 1: Extensions -->
  <rect x="20" y="48" width="280" height="330" rx="10" class="panel"/>
  <text x="36" y="74" class="step">① Install Remote extensions</text>
  <text x="36" y="94" class="s">Extensions tab → search “ssh”</text>
  <!-- ext rows -->
  <g>
    <rect x="36" y="108" width="248" height="44" rx="6" fill="#fff" stroke="#dde4ea"/>
    <rect x="46" y="118" width="24" height="24" rx="5" fill="#2980b9"/><text x="58" y="135" text-anchor="middle" font-family="Consolas,monospace" font-size="13" fill="#fff">&gt;_</text>
    <text x="80" y="124" class="t" font-weight="bold">Remote – SSH</text><text x="80" y="140" class="s">Microsoft ✔</text>
    <rect x="36" y="158" width="248" height="44" rx="6" fill="#fff" stroke="#dde4ea"/>
    <rect x="46" y="168" width="24" height="24" rx="5" fill="#2980b9"/><text x="58" y="185" text-anchor="middle" font-family="Consolas,monospace" font-size="13" fill="#fff">&#9707;</text>
    <text x="80" y="174" class="t" font-weight="bold">Remote Explorer</text><text x="80" y="190" class="s">Microsoft ✔</text>
    <rect x="36" y="208" width="248" height="44" rx="6" fill="#fff" stroke="#dde4ea"/>
    <rect x="46" y="218" width="24" height="24" rx="5" fill="#2980b9"/><text x="58" y="235" text-anchor="middle" font-family="Consolas,monospace" font-size="13" fill="#fff">&gt;_</text>
    <text x="80" y="224" class="t" font-weight="bold">Remote – SSH: Editing…</text><text x="80" y="240" class="s">optional, recommended</text>
  </g>
  <text x="36" y="278" class="s">Also handy (not required):</text>
  <text x="36" y="296" class="s">R · PDF viewer · CSV viewer</text>

  <!-- arrow -->
  <path d="M304,213 l28,0" stroke="#1c7293" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- Panel 2: Add host -->
  <rect x="340" y="48" width="280" height="330" rx="10" class="panel"/>
  <text x="356" y="74" class="step">② Add the Talapas SSH host</text>
  <text x="356" y="94" class="s">Remote Explorer → SSH → click “+”</text>
  <!-- prompt box -->
  <rect x="356" y="110" width="248" height="64" rx="6" fill="#23272e"/>
  <text x="368" y="130" font-family="Consolas,monospace" font-size="10.5" fill="#d7dde3">Enter SSH Connection Command</text>
  <rect x="366" y="138" width="228" height="26" rx="4" fill="#1b1f24" stroke="#3b4754"/>
  <text x="374" y="155" font-family="Consolas,monospace" font-size="10.5" fill="#9cdcfe">ssh [duckid]@login.talapas.uoregon.edu</text>
  <text x="356" y="196" class="s">Press Enter, then Enter again to save</text>
  <text x="356" y="214" class="s">to the default config file.</text>
  <!-- duo note -->
  <rect x="356" y="232" width="248" height="120" rx="6" fill="#fff" stroke="#dde4ea"/>
  <text x="368" y="252" class="t" font-weight="bold">On connect:</text>
  <text x="368" y="272" class="s">• type your Duck ID password</text>
  <text x="368" y="288" class="s">  (characters won’t show)</text>
  <text x="368" y="306" class="s">• Duo: type <tspan font-weight="bold">1</tspan> = push,</text>
  <text x="368" y="322" class="s">  2 = text, 3 = call</text>
  <text x="368" y="342" class="s">• wait for the green banner →</text>

  <!-- arrow -->
  <path d="M624,213 l28,0" stroke="#1c7293" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- Panel 3: Connected -->
  <rect x="660" y="48" width="280" height="330" rx="10" class="panel"/>
  <text x="676" y="74" class="step">③ Connected</text>
  <!-- editor window mock -->
  <rect x="676" y="92" width="248" height="190" rx="6" fill="#23272e"/>
  <rect x="676" y="92" width="40" height="190" rx="6" fill="#2c313a"/>
  <!-- integrated terminal -->
  <rect x="724" y="210" width="190" height="62" rx="4" fill="#15181d"/>
  <text x="734" y="228" font-family="Consolas,monospace" font-size="9.5" fill="#7fd1b9">[duckid@n0135 ~]$</text>
  <text x="734" y="244" font-family="Consolas,monospace" font-size="9.5" fill="#d7dde3">module load R</text>
  <text x="734" y="260" font-family="Consolas,monospace" font-size="9.5" fill="#d7dde3">Rscript hello_world.R</text>
  <text x="724" y="200" class="s" fill="#d7dde3" font-size="10">Terminal → New Terminal</text>
  <!-- remote banner -->
  <rect x="676" y="282" width="150" height="24" fill="#16825d"/>
  <text x="686" y="299" font-family="Consolas,monospace" font-size="10" fill="#fff">&gt;&lt; SSH: login.talapas…</text>
  <text x="676" y="330" class="s">Green banner (bottom-left) =</text>
  <text x="676" y="346" class="s">you’re on Talapas. Then</text>
  <text x="676" y="362" class="s"><tspan font-weight="bold">Open Folder</tspan> to browse your project.</text>

  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1c7293"/></marker></defs>
</svg>
