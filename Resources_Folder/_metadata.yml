# Per-folder metadata: render every page in Resources_Folder/ with a left
# TOC, page navigation (prev/next buttons at the bottom), and the workshop
# CSS — giving the appendices a "book" feel without making the whole
# project a Quarto book.

format:
  html:
    toc: true
    toc-location: left
    toc-depth: 3
    page-layout: article
    code-copy: true
    code-overflow: wrap
    embed-resources: true
    css: ../styles.css

execute:
  echo: true
  warning: false
  message: false

# Sidebar / next-prev navigation across the appendices.
sidebar:
  style: docked
  search: true
  contents:
    - section: "Prerequisites"
      contents:
        - text: "A · R programming"
          file: Appendix_A_R_Programming.qmd
        - text: "B · Unix & the command line"
          file: Appendix_B_Unix_Command_Line.qmd
        - text: "C · Single-cell biology refresher"
          file: Appendix_C_SC_Biology_Refresher.qmd
        - text: "D · Statistical foundations"
          file: Appendix_D_Statistical_Foundations.qmd
    - section: "Computing & tooling"
      contents:
        - text: "E · Computing fundamentals"
          file: Appendix_E_Computing_Fundamentals.qmd
        - text: "F · grep, regex & shell scripting"
          file: Appendix_F_GREP_Regex_Shell.qmd
        - text: "G · Git & GitHub"
          file: Appendix_G_Git_GitHub.qmd
        - text: "H · HPC with Talapas"
          file: Appendix_H_HPC_Talapas.qmd
    - section: "Data, formats & writing up"
      contents:
        - text: "I · Gene-expression databases & file formats"
          file: Appendix_I_Databases_FileFormats.qmd
        - text: "J · Bioinformatics file formats"
          file: Appendix_J_Bioinformatics_File_Formats.qmd
        - text: "K · Methods-section template"
          file: Appendix_K_Methods_Template.qmd
    - section: "Workshop reference"
      contents:
        - text: "Glossary"
          file: Glossary.qmd
        - text: "VS Code & Talapas"
          file: VSCode_Talapas.qmd
