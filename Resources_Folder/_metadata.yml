# Per-folder metadata: render every page in Resources_Folder/ with a left
# TOC, page navigation (prev/next buttons at the bottom), and the workshop
# CSS — giving the appendices a "book" feel without making the whole
# project a Quarto book.

format:
  html:
    toc: true
    toc-location: left
    toc-depth: 3
    page-layout: article
    code-copy: true
    code-overflow: wrap
    embed-resources: true
    css: ../styles.css

execute:
  echo: true
  warning: false
  message: false

# Shared bibliography for the reading material. Chapters cite with Pandoc
# syntax ([@key]) against references.bib and render in Nature style
# (superscript numbers) via nature.csl. Each page that cites work ends with
# a "## References" heading holding a numbered list (the ::: {#refs} div).
# Pages with no citations simply render nothing there.
bibliography: references.bib
csl: nature.csl
link-citations: true

# Sidebar / next-prev navigation across the appendices.
sidebar:
  style: docked
  search: true
  contents:
    - section: "Day 0 modules (optional refresher)"
      contents:
        - text: "P1 · Computer system fundamentals"
          file: Chapter_P1_Computer_Systems.qmd
        - text: "P2 · R & the command line"
          file: Chapter_P2_R_and_CommandLine.qmd
    - section: "Prerequisites & background"
      contents:
        - text: "A · Single-cell biology refresher"
          file: Appendix_A_SC_Biology_Refresher.qmd
        - text: "B · Statistical foundations"
          file: Appendix_B_Statistical_Foundations.qmd
    - section: "Tooling"
      contents:
        - text: "C · grep, regex & shell scripting"
          file: Appendix_C_GREP_Regex_Shell.qmd
        - text: "D · Git & GitHub"
          file: Appendix_D_Git_GitHub.qmd
        - text: "H · Core R commands reference"
          file: Appendix_H_Core_R_Commands.qmd
        - text: "I · Quarto & Markdown syntax"
          file: Appendix_I_Quarto_Markdown.qmd
    - section: "Data & file formats"
